[package]
name = "kikitori-fetch"
version.workspace = true
description = "kikitori のモデルの取得とキャッシュ（Hugging Face と GitHub Release、受け取り記録）"
edition.workspace = true
license.workspace = true

[dependencies]
kikitori-core = { version = "0.3.1-dev", path = "../kikitori-core" }
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
bzip2 = "0.5"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip"] }

[target.'cfg(not(any(target_os = "windows", target_os = "macos")))'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }

[dev-dependencies]
tempfile = "3"
