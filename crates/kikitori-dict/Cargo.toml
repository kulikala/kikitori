[package]
name = "kikitori-dict"
version.workspace = true
description = "kikitori の辞書による置換と用語集の読み（unidic-lite の配布物をそのまま読む）"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kikitori-core = { version = "0.7.0-dev", path = "../kikitori-core" }
notmecab = "0.5.1"
unicode-normalization = "0.1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
