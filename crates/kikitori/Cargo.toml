[package]
name = "kikitori"
version.workspace = true
readme = "../../README.md"
description = "日本語の会議録音を話者ごとに文字起こしする CLI（Hugging Face の認証不要）"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
metal = ["kikitori-qwen3asr/metal", "kikitori-whisper/metal"]
accelerate = ["kikitori-qwen3asr/accelerate", "kikitori-whisper/accelerate"]
cuda = ["kikitori-qwen3asr/cuda", "kikitori-whisper/cuda"]

[[bin]]
name = "kikitori"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
kikitori-core = { version = "0.8.0-dev", path = "../kikitori-core" }
kikitori-refine = { version = "0.8.0-dev", path = "../kikitori-refine" }
kikitori-dict = { version = "0.8.0-dev", path = "../kikitori-dict" }
kikitori-qwen3asr = { version = "0.8.0-dev", path = "../kikitori-qwen3asr" }
kikitori-whisper = { version = "0.8.0-dev", path = "../kikitori-whisper" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
kikitori-fetch = { version = "0.8.0-dev", path = "../kikitori-fetch" }
kikitori-audio = { version = "0.8.0-dev", path = "../kikitori-audio" }
kikitori-sherpa = { version = "0.8.0-dev", path = "../kikitori-sherpa" }
kikitori-reazon = { version = "0.8.0-dev", path = "../kikitori-reazon" }
sysinfo = "0.30"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
hound = "3.5"
jsonschema = { version = "0.18", features = ["draft202012"] }

