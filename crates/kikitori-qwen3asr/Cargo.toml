[package]
name = "kikitori-qwen3asr"
version.workspace = true
description = "kikitori の Qwen3-ASR エンジン（candle、元の safetensors をそのまま読む。CPU・Metal・CUDA）"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
accelerate = ["candle-core/accelerate", "candle-nn/accelerate", "candle-transformers/accelerate"]
debug = []

[dependencies]
kikitori-core = { version = "0.7.0", path = "../kikitori-core" }
candle-core = { version = "0.11", default-features = false }
candle-nn = { version = "0.11", default-features = false }
candle-transformers = { version = "0.11", default-features = false }
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
serde_json = "1"
anyhow = "1"
rustfft = "6"
rayon = "1"
