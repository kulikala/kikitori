[package]
name = "kikitori-refine"
version.workspace = true
description = "kikitori の本文の補正（別の認識結果と LLM で誤変換を直す）"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kikitori-core = { version = "0.8.0-dev", path = "../kikitori-core" }
kikitori-fetch = { version = "0.8.0-dev", path = "../kikitori-fetch" }
kikitori-dict = { version = "0.8.0-dev", path = "../kikitori-dict" }
kikitori-qwen3asr = { version = "0.8.0-dev", path = "../kikitori-qwen3asr" }
kikitori-whisper = { version = "0.8.0-dev", path = "../kikitori-whisper" }
notmecab = "0.5.1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip", "json"] }

[target.'cfg(not(any(target_os = "windows", target_os = "macos")))'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls", "gzip", "json"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
sysinfo = "0.30"

[dev-dependencies]
tempfile = "3"
