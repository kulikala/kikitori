[package]
name = "kikitori-reazon"
version.workspace = true
description = "kikitori の ReazonSpeech 認識エンジン（Python 版の既定の経路を ONNX Runtime で移したもの）"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kikitori-core = { version = "0.3.0", path = "../kikitori-core" }
kikitori-knf-sys = { version = "0.3.0", path = "../kikitori-knf-sys" }
ndarray = "0.17"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "api-28", "ndarray", "alternative-backend"] }
ort-sys = { version = "=2.0.0-rc.15", default-features = false, features = ["api-28"] }
sherpa-onnx = { version = "=2.0.0", default-features = false, features = ["static"] }

[dev-dependencies]
hound = "3.5"
serde_json = "1"
tempfile = "3"
