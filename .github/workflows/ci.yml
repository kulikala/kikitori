name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
    env:
      RUSTFLAGS: ${{ contains(matrix.target, 'windows') && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
    env:
      RUSTFLAGS: ${{ contains(matrix.target, 'windows') && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
      # rustup and cargo find their homes through HOME, so pin them to the
      # real ones before the test step swaps HOME for a temp folder.
      - name: Pin RUSTUP_HOME and CARGO_HOME
        shell: bash
        run: |
          rustup_home=$(rustup show home)
          cargo_home=${CARGO_HOME:-$HOME/.cargo}
          if command -v cygpath >/dev/null; then cargo_home=$(cygpath -w "$cargo_home"); fi
          echo "RUSTUP_HOME=$rustup_home" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$cargo_home" >> "$GITHUB_ENV"
      - name: Prepare a temp HOME (never the real one)
        shell: bash
        run: mkdir -p "${HOME}/.config" "${HOME}/.cache/huggingface" "${KIKITORI_MODELS}"
        env:
          HOME: ${{ runner.temp }}/kikitori-home
          XDG_CONFIG_HOME: ${{ runner.temp }}/kikitori-home/.config
          XDG_CACHE_HOME: ${{ runner.temp }}/kikitori-home/.cache
          HF_HOME: ${{ runner.temp }}/kikitori-home/.cache/huggingface
          KIKITORI_MODELS: ${{ runner.temp }}/kikitori-home/.cache/kikitori/models
      - name: Test (model-dependent tests stay ignored)
        run: cargo test --workspace
        env:
          # Never touch the real HOME (COMMON.md).
          HOME: ${{ runner.temp }}/kikitori-home
          XDG_CONFIG_HOME: ${{ runner.temp }}/kikitori-home/.config
          XDG_CACHE_HOME: ${{ runner.temp }}/kikitori-home/.cache
          HF_HOME: ${{ runner.temp }}/kikitori-home/.cache/huggingface
          KIKITORI_MODELS: ${{ runner.temp }}/kikitori-home/.cache/kikitori/models

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck build-release.sh and install.sh
        run: shellcheck scripts/build-release.sh install.sh
      - name: actionlint
        run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:latest

  windows-scripts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse build-release.ps1 and install.ps1 (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $bad = 0
          foreach ($f in "scripts\build-release.ps1", "install.ps1") {
            $e = $null
            [System.Management.Automation.Language.Parser]::ParseFile("$PWD\$f", [ref]$null, [ref]$e) | Out-Null
            if ($e.Count) { $e | ForEach-Object { Write-Host "${f}: $($_.Message)" }; $bad = 1 }
          }
          if ([Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes("$PWD\install.ps1")) -ne [IO.File]::ReadAllText("$PWD\install.ps1")) { Write-Host "install.ps1 must be ASCII only"; $bad = 1 }
          exit $bad
