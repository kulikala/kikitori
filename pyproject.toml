[project]
name = "kikitori"
dynamic = ["version"]
description = "日本語の会議録音を話者分離つきで文字起こしする CLI（Hugging Face の認証不要）"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{ name = "Kazuyuki Namba" }]
dependencies = [
  "sherpa-onnx>=1.13", "sherpa-onnx-core>=1.13", "numpy", "fugashi", "unidic-lite", "kaldi-native-fbank",
  "onnxruntime; sys_platform == 'darwin'",
]

[project.optional-dependencies]
# GPU 用の onnxruntime は、どれか 1 つだけを入れる（同じモジュール名なので共存できない）
cpu = ["onnxruntime"]
cuda = ["onnxruntime-gpu"]
directml = ["onnxruntime-directml"]
# kikitori-refine が Qwen3-ASR と kana-whisper を動かすのに使う
refine = ["torch", "transformers", "qwen-asr"]

[project.urls]
Homepage = "https://github.com/kulikala/kikitori"
Changelog = "https://github.com/kulikala/kikitori/blob/main/CHANGELOG.md"

[project.scripts]
kikitori = "kikitori.cli:main"
kikitori-refine = "kikitori.refine.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/kikitori/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "skills/", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/kikitori"]

[tool.pytest.ini_options]
markers = ["network: ネットワークが必要なテスト"]
addopts = "-m 'not network'"
pythonpath = ["src"]

[dependency-groups]
dev = ["pytest", "pyyaml"]
